<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Together — a shared listening room</title>
<style>
  :root{
    --bg: #1b1826;
    --panel: #241f33;
    --panel-2: #2c2640;
    --line: rgba(255,255,255,0.08);
    --text: #ece7f5;
    --text-dim: #a89ec2;
    --amber: #e8a14f;
    --amber-dim: rgba(232,161,79,0.15);
    --rose: #d98a9a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background: var(--bg); color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display:flex; justify-content:center; padding: 32px 16px 90px;
  }
  .app{width:100%; max-width:560px;}
  .top{text-align:center; margin-bottom:20px;}
  .top h1{font-size:22px; font-weight:400; letter-spacing:0.5px; margin:0 0 6px;}
  .top p{font-size:13px; color:var(--text-dim); margin:0; font-family: system-ui, sans-serif;}

  .name-row{display:flex; gap:8px; justify-content:center; margin-bottom:20px; font-family: system-ui, sans-serif;}
  .name-row input{
    background: var(--panel); border:0.5px solid var(--line); color:var(--text);
    border-radius:8px; padding:7px 12px; font-size:12px; width:130px; text-align:center;
    transition: border-color 0.2s ease;
  }
  .name-row input:focus{outline:none; border-color:var(--amber);}

  .pulse-row{display:flex; align-items:center; justify-content:center; gap:14px; margin: 6px 0 8px;}
  .dot{width:10px; height:10px; border-radius:50%; background:var(--rose); flex-shrink:0; transition: box-shadow 0.4s ease;}
  .dot.partner{background:var(--amber);}
  .dot.online{box-shadow: 0 0 0 4px rgba(232,161,79,0.18);}
  .pulse-line{width:120px; height:1px; background:var(--line); position:relative; overflow:visible;}
  .pulse-line::after{
    content:''; position:absolute; top:-2px; left:0; width:5px; height:5px; border-radius:50%;
    background:var(--amber); opacity:0;
  }
  .pulse-line.synced::after{ animation: travel 1.8s ease-in-out infinite; }
  @keyframes travel{
    0%{ left:0; opacity:0; } 10%{ opacity:1; } 50%{ left:calc(100% - 5px); opacity:1;}
    60%{ opacity:0; } 100%{ left:calc(100% - 5px); opacity:0;}
  }
  .pulse-label{font-family: system-ui, sans-serif; font-size:11px; color:var(--text-dim); text-align:center; margin: 0 0 22px; letter-spacing:0.3px; transition: color 0.3s ease;}
  .pulse-label.live{color:var(--amber);}

  .now{
    background: var(--panel); border-radius:14px; border:0.5px solid var(--line);
    padding: 20px; margin-bottom:18px; transition: border-color 0.3s ease;
  }
  .now-label{font-family: system-ui, sans-serif; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:0 0 12px; display:flex; justify-content:space-between; align-items:center;}
  .now-head{display:flex; gap:12px; align-items:center;}
  .thumb{width:64px; height:36px; border-radius:6px; background:var(--panel-2); object-fit:cover; flex-shrink:0; transition: opacity 0.3s ease;}
  .now-title{font-size:17px; margin:0; line-height:1.35; transition: opacity 0.25s ease;}
  .now-empty{color:var(--text-dim); font-size:14px; font-family: system-ui, sans-serif;}

  .player-wrap{margin-top:14px; border-radius:10px; overflow:hidden; background:#000; aspect-ratio:16/9; max-height:0; opacity:0; transition: max-height 0.4s ease, opacity 0.4s ease;}
  .player-wrap.active{max-height:400px; opacity:1;}
  #player{width:100%; height:100%; border:0;}

  .progress-row{display:flex; align-items:center; gap:10px; margin-top:16px; font-family: system-ui, sans-serif;}
  .time{font-size:11px; color:var(--text-dim); min-width:32px; text-align:center;}
  .bar{flex:1; height:4px; background:var(--panel-2); border-radius:2px; position:relative; cursor:pointer;}
  .bar-fill{position:absolute; left:0; top:0; height:100%; background:var(--amber); border-radius:2px; width:0%; transition: width 0.15s linear;}
  .bar-knob{position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--amber); transform:translate(-50%,-50%); left:0%; transition: left 0.15s linear;}

  .controls{display:flex; align-items:center; justify-content:center; gap:18px; margin-top:18px; font-family: system-ui, sans-serif;}
  .ctrl-btn{
    background:var(--panel-2); border:0.5px solid var(--line); color:var(--text);
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:15px; transition: transform 0.12s ease, border-color 0.15s ease;
  }
  .ctrl-btn:hover{border-color:var(--amber);}
  .ctrl-btn:active{transform: scale(0.92);}
  .ctrl-btn.play{width:54px; height:54px; background:var(--amber-dim); border-color:var(--amber); color:var(--amber); font-size:17px;}
  .ctrl-btn.disabled{opacity:0.35; pointer-events:none;}

  .vol-row{display:flex; align-items:center; gap:8px; justify-content:center; margin-top:14px; font-family: system-ui, sans-serif;}
  .vol-row i{font-size:13px; color:var(--text-dim); font-style:normal;}
  .vol-row input[type=range]{width:110px; accent-color: var(--amber);}

  .add-row{display:flex; gap:8px; margin-bottom:18px;}
  .add-row input{
    flex:1; background:var(--panel); border:0.5px solid var(--line); color:var(--text);
    border-radius:8px; padding:11px 12px; font-size:13px; font-family: system-ui, sans-serif;
    transition: border-color 0.2s ease;
  }
  .add-row input:focus{outline:none; border-color:var(--amber);}
  .add-row input::placeholder{color: var(--text-dim);}
  .add-row button{
    background:var(--amber-dim); border:0.5px solid var(--amber); color:var(--amber);
    border-radius:8px; padding:0 18px; font-size:13px; cursor:pointer; font-family: system-ui, sans-serif;
    min-width:64px; transition: opacity 0.15s ease;
  }
  .add-row button:disabled{opacity:0.5; cursor:default;}
  .spinner{width:13px; height:13px; border-radius:50%; border:2px solid rgba(232,161,79,0.3); border-top-color:var(--amber); animation: spin 0.7s linear infinite; display:inline-block;}
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .queue{font-family: system-ui, sans-serif;}
  .queue-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); margin:0 0 10px;}
  .qitem{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    background:var(--panel); border:0.5px solid var(--line); margin-bottom:6px; font-size:13px;
    animation: qin 0.3s ease;
  }
  @keyframes qin{ from{ opacity:0; transform: translateY(4px);} to{opacity:1; transform:none;} }
  .qitem.current{border-color:var(--amber);}
  .qthumb{width:44px; height:26px; border-radius:4px; object-fit:cover; flex-shrink:0; background:var(--panel-2);}
  .qitem .ttl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .qitem button{background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:2px 6px; transition:color 0.15s ease;}
  .qitem button:hover{color:var(--rose);}
  .queue-empty{color:var(--text-dim); font-size:13px; padding:6px 2px;}

  .toast-wrap{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{
    background:var(--panel-2); border:0.5px solid var(--line); color:var(--text); font-family: system-ui, sans-serif;
    font-size:13px; padding:9px 16px; border-radius:20px; opacity:0; transform:translateY(8px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.error{border-color:var(--rose); color:var(--rose);}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Together</h1>
    <p>one room, one song, always in sync</p>
  </div>

  <div class="name-row">
    <input id="nameInput" placeholder="your name" maxlength="14">
  </div>

  <div class="pulse-row">
    <div class="dot you" id="dotYou"></div>
    <div class="pulse-line" id="pulseLine"></div>
    <div class="dot partner" id="dotPartner"></div>
  </div>
  <div class="pulse-label" id="pulseLabel">waiting for your partner</div>

  <div class="now">
    <p class="now-label"><span>now playing</span></p>
    <div class="now-head">
      <img class="thumb" id="thumbImg" style="display:none;">
      <div style="flex:1; min-width:0;">
        <p class="now-title" id="nowTitle" style="display:none;"></p>
        <p class="now-empty" id="nowEmpty">Nothing queued yet. Add a song below to start.</p>
      </div>
    </div>
    <div class="player-wrap" id="playerWrap"><div id="player"></div></div>
    <div class="progress-row" id="progressRow" style="display:none;">
      <span class="time" id="curTime">0:00</span>
      <div class="bar" id="bar"><div class="bar-fill" id="barFill"></div><div class="bar-knob" id="barKnob"></div></div>
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="controls">
      <div class="ctrl-btn" id="prevBtn" title="Restart"><span>⟲</span></div>
      <div class="ctrl-btn play" id="playBtn" title="Play/pause"><span>▶</span></div>
      <div class="ctrl-btn" id="skipBtn" title="Skip"><span>⏭</span></div>
    </div>
    <div class="vol-row">
      <i>vol</i>
      <input type="range" id="volSlider" min="0" max="100" value="70">
    </div>
  </div>

  <div class="add-row">
    <input id="urlInput" placeholder="paste a YouTube link and press add">
    <button id="addBtn">Add</button>
  </div>

  <div class="queue">
    <p class="queue-label">up next</p>
    <div id="queueList"><p class="queue-empty">Queue is empty.</p></div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
let ytPlayer = null, ytReady = false, scrubbing = false;
let room = { queue: [], currentIndex: -1, isPlaying: false, startedAt: 0, elapsedAtPause: 0, partners: {}, version: 0 };
let myName = '', lastKnownVersion = -1, applyingRemote = false;

function extractVideoId(url){
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : (/^[a-zA-Z0-9_-]{11}$/.test(url.trim()) ? url.trim() : null);
}
function fmtTime(s){
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60), sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}
function toast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(), 300); }, 3200);
}

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('player', {
    height:'100%', width:'100%',
    playerVars:{ rel:0, modestbranding:1 },
    events:{ onReady: () => { ytReady = true; ytPlayer.setVolume(70); syncPlayerToRoom(); }, onStateChange: onPlayerStateChange }
  });
}
function onPlayerStateChange(e){
  if (applyingRemote) return;
  if (e.data === YT.PlayerState.ENDED) skipSong();
}

async function loadName(){
  try{
    const res = await window.storage.get('duo_name', false);
    if (res && res.value){ myName = res.value; document.getElementById('nameInput').value = myName; }
  }catch(e){}
}
async function loadRoom(){
  try{
    const res = await window.storage.get('room', true);
    if (res && res.value){
      const data = JSON.parse(res.value);
      if (data.version !== lastKnownVersion){
        lastKnownVersion = data.version;
        room = data;
        render();
        syncPlayerToRoom();
      } else {
        renderPresenceOnly();
      }
    }
  }catch(e){}
}
async function saveRoom(){
  room.version = (room.version || 0) + 1;
  lastKnownVersion = room.version;
  try{ await window.storage.set('room', JSON.stringify(room), true); }
  catch(e){ toast('Could not sync — check your connection.', true); }
  render();
}
function currentSong(){ return room.queue[room.currentIndex] || null; }

function syncPlayerToRoom(){
  if (!ytReady) return;
  const song = currentSong();
  applyingRemote = true;
  if (!song){
    document.getElementById('playerWrap').classList.remove('active');
  } else {
    document.getElementById('playerWrap').classList.add('active');
    const vd = ytPlayer.getVideoData ? ytPlayer.getVideoData() : {};
    if (vd.video_id !== song.videoId) ytPlayer.cueVideoById(song.videoId);
    const elapsed = room.isPlaying ? (Date.now() - room.startedAt)/1000 : room.elapsedAtPause;
    setTimeout(() => {
      try{
        ytPlayer.seekTo(Math.max(0, elapsed), true);
        if (room.isPlaying) ytPlayer.playVideo(); else ytPlayer.pauseVideo();
      }catch(e){}
    }, 200);
  }
  setTimeout(()=>{ applyingRemote = false; }, 650);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(){
  const song = currentSong();
  const titleEl = document.getElementById('nowTitle');
  const emptyEl = document.getElementById('nowEmpty');
  const thumbEl = document.getElementById('thumbImg');
  const progRow = document.getElementById('progressRow');

  if (song){
    titleEl.style.display = 'block'; emptyEl.style.display = 'none';
    titleEl.textContent = song.title;
    thumbEl.style.display = 'block'; thumbEl.src = `https://img.youtube.com/vi/${song.videoId}/mqdefault.jpg`;
    progRow.style.display = 'flex';
  } else {
    titleEl.style.display = 'none'; emptyEl.style.display = 'block';
    thumbEl.style.display = 'none'; progRow.style.display = 'none';
  }
  document.getElementById('playBtn').innerHTML = room.isPlaying ? '<span>⏸</span>' : '<span>▶</span>';
  const controlsDisabled = !song;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.toggle('disabled', controlsDisabled));

  const list = document.getElementById('queueList');
  if (room.queue.length === 0){
    list.innerHTML = '<p class="queue-empty">Queue is empty.</p>';
  } else {
    list.innerHTML = room.queue.map((s,i) => `
      <div class="qitem ${i === room.currentIndex ? 'current' : ''}">
        <img class="qthumb" src="https://img.youtube.com/vi/${s.videoId}/default.jpg">
        <span class="ttl">${escapeHtml(s.title)}</span>
        <button onclick="removeSong(${i})" aria-label="Remove">✕</button>
      </div>`).join('');
  }
  renderPresenceOnly();
}

function renderPresenceOnly(){
  const others = Object.entries(room.partners || {}).filter(([n]) => n && n !== myName);
  const activeOther = others.find(([,ts]) => Date.now() - ts < 15000);
  const line = document.getElementById('pulseLine');
  const label = document.getElementById('pulseLabel');
  document.getElementById('dotYou').classList.toggle('online', !!myName);
  document.getElementById('dotPartner').classList.toggle('online', !!activeOther);
  if (activeOther && room.isPlaying){
    line.classList.add('synced'); label.classList.add('live');
    label.textContent = `listening together with ${activeOther[0]}`;
  } else if (activeOther){
    line.classList.remove('synced'); label.classList.remove('live');
    label.textContent = `${activeOther[0]} is here`;
  } else {
    line.classList.remove('synced'); label.classList.remove('live');
    label.textContent = 'waiting for your partner';
  }
}

setInterval(() => {
  if (!ytReady || !room.isPlaying || scrubbing) return;
  try{
    const dur = ytPlayer.getDuration() || 0;
    const cur = ytPlayer.getCurrentTime() || 0;
    document.getElementById('curTime').textContent = fmtTime(cur);
    document.getElementById('durTime').textContent = fmtTime(dur);
    const pct = dur ? (cur/dur*100) : 0;
    document.getElementById('barFill').style.width = pct + '%';
    document.getElementById('barKnob').style.left = pct + '%';
  }catch(e){}
}, 400);

document.getElementById('bar').addEventListener('click', async (e) => {
  if (!currentSong() || !ytReady) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  const dur = ytPlayer.getDuration() || 0;
  const newTime = pct * dur;
  room.startedAt = Date.now() - newTime*1000;
  room.elapsedAtPause = newTime;
  await saveRoom();
  syncPlayerToRoom();
});

document.getElementById('volSlider').addEventListener('input', (e) => {
  if (ytReady) ytPlayer.setVolume(Number(e.target.value));
});

async function addSong(){
  const input = document.getElementById('urlInput');
  const btn = document.getElementById('addBtn');
  const id = extractVideoId(input.value.trim());
  if (!id){ toast('That doesn\'t look like a valid YouTube link.', true); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  let title = 'Untitled song';
  try{
    const r = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    if (r.ok){ const j = await r.json(); title = j.title; }
  }catch(e){}
  room.queue.push({ videoId: id, title });
  if (room.currentIndex === -1){ room.currentIndex = 0; room.isPlaying = true; room.startedAt = Date.now(); room.elapsedAtPause = 0; }
  input.value = '';
  await saveRoom();
  syncPlayerToRoom();
  toast('Added to the queue.');
  btn.disabled = false; btn.innerHTML = 'Add';
}
async function removeSong(i){
  room.queue.splice(i,1);
  if (i < room.currentIndex) room.currentIndex--;
  if (i === room.currentIndex){
    room.elapsedAtPause = 0; room.startedAt = Date.now();
    if (room.currentIndex >= room.queue.length) room.currentIndex = room.queue.length - 1;
  }
  await saveRoom();
  syncPlayerToRoom();
}
async function togglePlay(){
  if (!currentSong()) return;
  if (room.isPlaying){ room.elapsedAtPause = (Date.now() - room.startedAt)/1000; room.isPlaying = false; }
  else { room.startedAt = Date.now() - room.elapsedAtPause*1000; room.isPlaying = true; }
  await saveRoom();
  syncPlayerToRoom();
}
async function skipSong(){
  if (!currentSong()) return;
  room.currentIndex = Math.min(room.currentIndex + 1, room.queue.length - 1);
  room.startedAt = Date.now(); room.elapsedAtPause = 0;
  room.isPlaying = room.queue.length > 0;
  await saveRoom();
  syncPlayerToRoom();
}
async function restartSong(){
  if (!currentSong()) return;
  room.startedAt = Date.now(); room.elapsedAtPause = 0;
  await saveRoom();
  syncPlayerToRoom();
}
async function heartbeat(){
  if (!myName) return;
  room.partners = room.partners || {};
  room.partners[myName] = Date.now();
  try{ await window.storage.set('room', JSON.stringify(room), true); }catch(e){}
}

document.getElementById('addBtn').onclick = addSong;
document.getElementById('urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') addSong(); });
document.getElementById('playBtn').onclick = togglePlay;
document.getElementById('skipBtn').onclick = skipSong;
document.getElementById('prevBtn').onclick = restartSong;
document.getElementById('nameInput').addEventListener('input', async e => {
  myName = e.target.value.trim();
  try{ await window.storage.set('duo_name', myName, false); }catch(e){}
  renderPresenceOnly();
});

(async () => {
  await loadName();
  await loadRoom();
  render();
  setInterval(loadRoom, 2000);
  setInterval(heartbeat, 5000);
  heartbeat();
})();
</script>
</body>
</html>
