<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Duo Listen - Sync Music with Friends</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6C5CE7;
      --secondary: #A29BFE;
      --accent: #FD79A8;
      --dark: #1a1a2e;
      --darker: #0f0f1a;
      --light: #F5F6FA;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.1);
      --success: #00b894;
      --warning: #fdcb6e;
      --danger: #ff7675;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 50%, #2d1b69 100%);
      color: var(--light);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px;
    }

    /* Background Animation */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(108,92,231,0.15) 0%, transparent 70%);
      top: -50%;
      left: -50%;
      animation: pulse 8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    /* Header */
    .header {
      padding: 20px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 0.8rem;
      color: var(--secondary);
    }

    /* Main Content */
    .main-content {
      padding: 0 20px;
      max-width: 500px;
      margin: 0 auto;
    }

    /* Tab Content */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Room Section */
    .room-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .room-code-display {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 8px;
      text-align: center;
      color: var(--secondary);
      margin: 20px 0;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 20px rgba(108,92,231,0.5);
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .input-group input {
      flex: 1;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.1);
      color: var(--light);
      font-size: 1rem;
      text-align: center;
      letter-spacing: 4px;
      text-transform: uppercase;
      outline: none;
      transition: all 0.3s;
    }

    .input-group input:focus {
      background: rgba(255,255,255,0.15);
      box-shadow: 0 0 0 2px var(--primary);
    }

    .input-group input::placeholder {
      letter-spacing: normal;
      text-transform: none;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(108,92,231,0.4);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--success), #00cec9);
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #e17055);
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 15px;
      width: 100%;
      justify-content: center;
    }

    .status-badge.connected {
      background: rgba(0,184,148,0.2);
      color: var(--success);
    }

    .status-badge.disconnected {
      background: rgba(255,118,117,0.2);
      color: var(--danger);
    }

    .users-online {
      text-align: center;
      margin-top: 15px;
      color: var(--secondary);
      font-size: 0.9rem;
    }

    .users-online i {
      color: var(--success);
      margin-right: 5px;
    }

    /* Now Playing Card */
    .now-playing-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 20px;
      text-align: center;
    }

    .album-art-container {
      width: 200px;
      height: 200px;
      margin: 0 auto 20px;
      position: relative;
    }

    .album-art {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      animation: rotate 20s linear infinite;
      animation-play-state: paused;
    }

    .album-art.playing {
      animation-play-state: running;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .album-art::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: var(--dark);
      border-radius: 50%;
      border: 4px solid var(--glass-border);
    }

    .track-info h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-info p {
      font-size: 0.9rem;
      color: var(--secondary);
    }

    /* Progress Bar */
    .progress-container {
      margin: 20px 0;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 3px;
      width: 0%;
      transition: width 0.1s linear;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .time-display {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--secondary);
      margin-top: 8px;
    }

    /* Main Controls */
    .main-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 25px 0;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      color: var(--light);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: rgba(255,255,255,0.2);
      transform: scale(1.1);
    }

    .control-btn.play-pause {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      font-size: 1.5rem;
    }

    .control-btn.play-pause:hover {
      transform: scale(1.15);
      box-shadow: 0 10px 30px rgba(108,92,231,0.5);
    }

    .control-btn.stop {
      background: rgba(255,118,117,0.3);
      color: var(--danger);
    }

    /* Secondary Controls */
    .secondary-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 15px 0;
      border-top: 1px solid var(--glass-border);
      margin-top: 15px;
    }

    .secondary-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--secondary);
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .secondary-btn i {
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      transition: all 0.2s;
    }

    .secondary-btn:hover i {
      background: rgba(255,255,255,0.15);
      color: var(--light);
    }

    .secondary-btn.active {
      color: var(--accent);
    }

    .secondary-btn.active i {
      background: rgba(253,121,168,0.2);
      color: var(--accent);
    }

    /* Reactions */
    .reactions-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .reaction-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.1);
      font-size: 1.3rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reaction-btn:hover {
      transform: scale(1.2);
      background: rgba(255,255,255,0.2);
    }

    .reaction-btn:active {
      transform: scale(0.9);
    }

    /* Volume & Speed */
    .extra-controls {
      background: var(--glass);
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-row i {
      width: 24px;
      color: var(--secondary);
      font-size: 1rem;
    }

    .slider-container {
      flex: 1;
    }

    .slider {
      width: 100%;
      height: 6px;
      border-radius: 3px;
