<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duo Listen - Modern Music Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="player-container">
    <div class="header">
      <h1>🎵 Duo Listen</h1>
      <p>A modern music player</p>
    </div>

    <div class="search-container">
      <input type="text" id="search" placeholder="Search YouTube Music...">
      <button onclick="searchYouTube()"><i class="fas fa-search"></i></button>
    </div>

    <button class="spotify-btn" onclick="importSpotify()">
      <i class="fab fa-spotify"></i> Import Spotify Playlist
    </button>

    <div class="playlist">
      <h2>Your Playlist</h2>
      <div class="tracks" id="tracks">
        <div class="track" onclick="playSample(0)">
          <img src="https://i.ytimg.com/vi/dQw4w9WgXcQ/default.jpg" alt="Track">
          <div class="track-info">
            <h4>Never Gonna Give You Up</h4>
            <p>Rick Astley</p>
          </div>
        </div>
        <div class="track" onclick="playSample(1)">
          <img src="https://i.ytimg.com/vi/9bZkp7q19f0/default.jpg" alt="Track">
          <div class="track-info">
            <h4>Gangnam Style</h4>
            <p>PSY</p>
          </div>
        </div>
      </div>
    </div>

    <div class="now-playing">
      <img id="album-art" src="https://via.placeholder.com/60" alt="Album Art">
      <div class="track-info">
        <h3 id="track-title">No track selected</h3>
        <p id="track-artist">Artist</p>
      </div>
    </div>

    <div class="progress-container" onclick="seek(event)">
      <div class="progress" id="progress"></div>
    </div>

    <div class="controls">
      <button onclick="prevTrack()"><i class="fas fa-step-backward"></i></button>
      <button onclick="togglePlay()" id="play-btn"><i class="fas fa-play"></i></button>
      <button onclick="nextTrack()"><i class="fas fa-step-forward"></i></button>
    </div>
  </div>

  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
