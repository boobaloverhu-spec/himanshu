    :root {

    * {

      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;

        radial-gradient(ellipse 500px 350px at 80% 70%, rgba(236,72,153,0.08) 0%, transparent 70%),

    .bg-glow {

      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      will-change: transform;

    .bg-glow-1 {

    .input-group {

    .btn {

      transition: transform 0.2s var(--ios-spring), box-shadow 0.2s var(--ios-ease), opacity 0.1s;

    .btn-primary:active {

    .btn-success {

    .users-online {

    .tabs {

      display: flex;
      align-items: center;

    .tab:active { transform: scale(0.93); }

      color: white;

    /* ===== TAB CONTENT ===== */
    .tab-content {

    }

    @keyframes contentIn {

    /* ===== ALBUM ART - iOS MUSIC STYLE ===== */
    .album-art-container {

    .track-info {

    .track-title {

    .progress-container {

    .controls {

    .control-btn:active {

      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.08);

      -webkit-appearance: none;

      padding: 13px 16px;

      transition: transform 0.15s var(--ios-spring), box-shadow 0.15s;
      will-change: transform;
      box-shadow: 0 3px 12px rgba(139,92,246,0.3);
    }

    .search-box button:active {
      transform: scale(0.9);
      box-shadow: 0 1px 6px rgba(139,92,246,0.2);
    }

    /* ===== BOTTOM NAV - iOS TAB BAR ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: rgba(12,12,20,0.96);
      border-top: 0.5px solid rgba(255,255,255,0.08);
      padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-around;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 12px;
      transition: color 0.2s var(--ios-ease), transform 0.2s var(--ios-spring);
      will-change: transform;
      font-family: inherit;
      -webkit-user-select: none;
      user-select: none;
    }

    .nav-item:active {
      transform: scale(0.85);
    }

    .nav-item.active {
      color: #A78BFA;
    }

    .nav-item i {
      font-size: 1.25rem;
      transition: transform 0.25s var(--ios-spring);
    }

    .nav-item.active i {
      transform: translateY(-1px) scale(1.05);
    }

    .nav-item span {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    /* ===== UTILITY ===== */
    .hidden { display: none !important; }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.3); border-radius: 2px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 480px) {
      .header h1 { font-size: 1.35rem; }
      .room-code-display { font-size: 1.7rem; letter-spacing: 7px; }
      .album-art-container { max-width: 220px; }
      .control-btn.play { width: 62px; height: 62px; font-size: 1.3rem; }
      .controls { gap: 22px; }
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="header">
    <h1>🎵 Duo Listen</h1>
    <p>Sync music with friends in real-time</p>
  </div>

  <div class="main-container">
    <div class="room-section" id="room-section">
      <div id="join-view">
        <div class="input-group">
          <input type="text" id="room-input" placeholder="ABC123" maxlength="6" autocomplete="off">
        </div>
        <button class="btn btn-primary" onclick="joinRoom()">
          <i class="fas fa-sign-in-alt"></i> Join Room
        </button>
        <button class="btn btn-success" onclick="createRoom()">
          <i class="fas fa-plus"></i> Create New Room
        </button>
      </div>

      <div id="room-view" class="hidden">
        <p style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-bottom:4px;letter-spacing:1.5px;font-weight:500;">ROOM CODE</p>
        <div class="room-code-display" id="room-code">------</div>
        <div class="users-online">
          <i class="fas fa-circle"></i>
          <span id="user-count">1</span> user(s) online
        </div>
        <button class="btn btn-danger" onclick="leaveRoom()">
          <i class="fas fa-sign-out-alt"></i> Leave Room
        </button>
      </div>

      <div id="status" class="status-badge">Not connected</div>
    </div>

    <div class="tabs" id="tabs-container">
      <div class="tab-indicator" id="tab-indicator"></div>
      <button class="tab active" data-tab="player" onclick="switchTab('player')">
        <i class="fas fa-play"></i> Player
      </button>
      <button class="tab" data-tab="queue" onclick="switchTab('queue')">
        <i class="fas fa-list"></i> Queue
      </button>
      <button class="tab" data-tab="search" onclick="switchTab('search')">
        <i class="fas fa-search"></i> Search
      </button>
    </div>

    <div id="player-tab" class="tab-content active">
      <div class="player-card">
        <div class="album-art-container" id="album-container">
          <img id="album-art" class="album-art" src="https://via.placeholder.com/300/8B5CF6/FFFFFF?text=🎵" alt="Album Art">
        </div>

        <div class="track-info">
          <div class="track-title" id="track-title">No track selected</div>
          <div class="track-artist" id="track-artist">Select a song to start</div>
        </div>

        <div class="progress-container">
          <div class="progress-bar" id="progress-bar" onclick="seek(event)">
            <div class="progress-fill" id="progress">
              <div class="progress-dot"></div>
            </div>
          </div>
          <div class="time-display">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="control-btn" onclick="prevTrack()" aria-label="Previous">
            <i class="fas fa-step-backward"></i>
          </button>
          <button class="control-btn play" onclick="togglePlay()" id="play-btn" aria-label="Play/Pause">
            <i class="fas fa-play"></i>
          </button>
          <button class="control-btn" onclick="nextTrack()" aria-label="Next">
            <i class="fas fa-step-forward"></i>
          </button>
        </div>

        <div class="reactions" id="reactions-container">
          <button class="reaction-btn" onclick="sendReaction('❤️', this)">❤️</button>
          <button class="reaction-btn" onclick="sendReaction('🔥', this)">🔥</button>
          <button class="reaction-btn" onclick="sendReaction('🎵', this)">🎵</button>
          <button class="reaction-btn" onclick="sendReaction('😍', this)">😍</button>
          <button class="reaction-btn" onclick="sendReaction('👏', this)">👏</button>
        </div>

        <div class="extra-controls">
          <div class="control-row">
            <i class="fas fa-volume-up"></i>
            <input type="range" class="slider" id="volume" min="0" max="100" value="80" oninput="setVolume(this.value)">
            <span id="volume-text" style="font-size:0.78rem;color:var(--text-muted);min-width:36px;text-align:right;font-variant-numeric:tabular-nums;">80%</span>
          </div>
          <div class="control-row">
            <i class="fas fa-tachometer-alt"></i>
            <span style="font-size:0.82rem;color:var(--text-muted);font-weight:500;">Speed</span>
            <button class="speed-btn" id="speed-btn" onclick="toggleSpeed()">1x</button>
          </div>
        </div>
      </div>
    </div>

    <div id="queue-tab" class="tab-content">
      <div class="queue-section">
        <div class="queue-header">
          <h3><i class="fas fa-list-music" style="margin-right:6px;"></i>Up Next</h3>
          <button class="btn" style="padding:7px 14px;font-size:0.72rem;background:rgba(255,255,255,0.06);color:var(--text-muted);border:1px solid rgba(255,255,255,0.08);" onclick="clearQueue()">
            <i class="fas fa-trash" style="margin-right:4px;"></i>Clear
          </button>
        </div>
        <div class="queue-list" id="queue-list"></div>
      </div>
    </div>

    <div id="search-tab" class="tab-content">
      <div class="queue-section">
        <div class="search-section">
          <div class="search-box">
            <input type="text" id="search-input" placeholder="Search YouTube..." autocomplete="off">
            <button onclick="searchYouTube()"><i class="fas fa-search"></i></button>
          </div>
        </div>
        <div class="queue-list" id="search-results">
          <p style="text-align:center;color:var(--text-muted);padding:32px 16px;font-size:0.88rem;">
            <i class="fas fa-search" style="font-size:1.8rem;margin-bottom:10px;display:block;opacity:0.4;"></i>
            Search for songs to add to queue
          </p>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('player')">
      <i class="fas fa-play-circle"></i>
      <span>Player</span>
    </button>
    <button class="nav-item" onclick="switchTab('queue')">
      <i class="fas fa-list"></i>
      <span>Queue</span>
    </button>
    <button class="nav-item" onclick="switchTab('search')">
      <i class="fas fa-search"></i>
      <span>Search</span>
    </button>
  </nav>

  <div id="youtube-player" style="position:absolute;left:-9999px;top:-9999px;"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_iHeILrrWKYDoYhjb7KJ68Powo9YxvIA",
      authDomain: "duooo-7dd92.firebaseapp.com",
      databaseURL: "https://duooo-7dd92-default-rtdb.firebaseio.com",
      projectId: "duooo-7dd92",
      storageBucket: "duooo-7dd92.firebasestorage.app",
      messagingSenderId: "830901515322",
      appId: "1:830901515322:web:75139f83385bcf8f38f103",
      measurementId: "G-7W6QEGT3DF"
    };

    const YOUTUBE_API_KEY = 'AIzaSyCgLgZ_sxnFCc2chmEwsiRX5WUt_VQgdNs';
    const SPOTIFY_CLIENT_ID = '';

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let player = null;
    let currentRoom = null;
    let isHost = false;
    let currentTrackIndex = 0;
    let isPlaying = false;
    let playbackSpeed = 1;
    let volume = 0.8;
    let myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
    let roomRef = null;
    let isSyncing = false;
    let progressRAF = null;
    let lastProgressPct = 0;

    const demoTracks = [
      { id: 'dQw4w9WgXcQ', title: 'Never Gonna Give You Up', artist: 'Rick Astley', thumb: 'https://i.ytimg.com/vi/dQw4w9WgXcQ/default.jpg' },
      { id: 'jNQXAC9IVRw', title: 'Me at the zoo', artist: 'jawed', thumb: 'https://i.ytimg.com/vi/jNQXAC9IVRw/default.jpg' },
      { id: '9bZkp7q19f0', title: 'Gangnam Style', artist: 'PSY', thumb: 'https://i.ytimg.com/vi/9bZkp7q19f0/default.jpg' }
    ];

    let queue = [...demoTracks];

    // ===== YOUTUBE =====
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0', width: '0',
        playerVars: { 'playsinline': 1, 'controls': 0 },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(e) {
      player.setVolume(volume * 100);
      loadTrack(0, false);
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayButton();
        startProgress();
        if (currentRoom && isHost) syncState();
      } else if (e.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayButton();
        stopProgress();
        if (currentRoom && isHost) syncState();
      } else if (e.data === YT.PlayerState.ENDED) {
        nextTrack();
      }
    }

    // ===== ROOM =====
    function generateRoomCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    async function createRoom() {
      const code = generateRoomCode();
      currentRoom = code;
      isHost = true;
      await db.ref('rooms/' + code).set({
        host: myUserId,
        createdAt: Date.now(),
        trackIndex: 0,
        isPlaying: false,
        currentTime: 0,
        queue: queue,
        lastAction: Date.now(),
        users: { [myUserId]: true }
      });
      showRoomUI(code);
      listenToRoom(code);
      updateStatus('Room created! Share code with friend.', true);
      renderQueue();
    }

    async function joinRoom() {
      const code = document.getElementById('room-input').value.toUpperCase().trim();
      if (code.length !== 6) { alert('Enter a valid 6-character room code'); return; }
      const snap = await db.ref('rooms/' + code).once('value');
      if (!snap.exists()) { alert('Room not found!'); return; }
      currentRoom = code;
      isHost = false;
      await db.ref('rooms/' + code + '/users/' + myUserId).set(true);
      const data = snap.val();
      if (data.queue && data.queue.length > 0) {
        queue = Array.isArray(data.queue) ? data.queue : Object.values(data.queue);
        currentTrackIndex = data.trackIndex || 0;
        if (queue[currentTrackIndex]) {
          loadTrack(currentTrackIndex, false);
          if (data.isPlaying) {
            setTimeout(() => {
              player.seekTo(data.currentTime || 0, true);
              player.playVideo();
            }, 600);
          }
        }
      }
      showRoomUI(code);
      listenToRoom(code);
      updateStatus('Connected to room!', true);
      renderQueue();
    }

    function showRoomUI(code) {
      document.getElementById('join-view').classList.add('hidden');
      document.getElementById('room-view').classList.remove('hidden');
      document.getElementById('room-code').textContent = code;
    }

    async function leaveRoom() {
      if (currentRoom) {
        await db.ref('rooms/' + currentRoom + '/users/' + myUserId).remove();
        if (roomRef) roomRef.off();
        const snap = await db.ref('rooms/' + currentRoom + '/users').once('value');
        if (!snap.exists() || Object.keys(snap.val()).length === 0) {
          await db.ref('rooms/' + currentRoom).remove();
        }
      }
      resetRoomState();
    }

    function resetRoomState() {
      currentRoom = null;
      isHost = false;
      if (roomRef) { roomRef.off(); roomRef = null; }
      document.getElementById('join-view').classList.remove('hidden');
      document.getElementById('room-view').classList.add('hidden');
      document.getElementById('room-input').value = '';
      updateStatus('Not connected', false);
      queue = [...demoTracks];
      currentTrackIndex = 0;
      renderQueue();
    }

    // ===== REAL-TIME SYNC =====
    function listenToRoom(code) {
      if (roomRef) roomRef.off();
      roomRef = db.ref('rooms/' + code);
      roomRef.on('value', (snap) => {
        const data = snap.val();
        if (!data) return;
        const users = data.users || {};
        document.getElementById('user-count').textContent = Object.keys(users).length;
        if (isSyncing) return;
        if (data.queue) {
          const nq = Array.isArray(data.queue) ? data.queue : Object.values(data.queue);
          if (JSON.stringify(nq) !== JSON.stringify(queue)) {
            queue = nq;
            renderQueue();
          }
        }
        if (data.trackIndex !== undefined && data.trackIndex !== currentTrackIndex) {
          if (queue[data.trackIndex]) {
            isSyncing = true;
            currentTrackIndex = data.trackIndex;
            loadTrack(currentTrackIndex, false);
            setTimeout(() => { isSyncing = false; }, 400);
          }
        }
        if (data.isPlaying !== undefined && data.isPlaying !== isPlaying && player) {
          if (data.isPlaying) {
            player.seekTo(data.currentTime || 0, true);
            player.playVideo();
          } else {
            player.pauseVideo();
          }
        } else if (data.isPlaying && isPlaying && player && player.getCurrentTime) {
          const diff = Math.abs((data.currentTime || 0) - player.getCurrentTime());
          if (diff > 3) player.seekTo(data.currentTime || 0, true);
        }
      });
    }

    function syncState() {
      if (!currentRoom || !isHost || !player) return;
      const ct = player.getCurrentTime ? player.getCurrentTime() : 0;
      db.ref('rooms/' + currentRoom).update({
        trackIndex: currentTrackIndex,
        isPlaying: isPlaying,
        currentTime: ct,
        lastAction: Date.now()
      });
    }

    function syncQueue() {
      if (!currentRoom || !isHost) return;
      db.ref('rooms/' + currentRoom + '/queue').set(queue);
    }

    // ===== TRACKS =====
    function loadTrack(index, sync = true) {
      if (index < 0 || index >= queue.length) return;
      currentTrackIndex = index;
      const track = queue[index];
      const titleEl = document.getElementById('track-title');
      const artistEl = document.getElementById('track-artist');
      const artEl = document.getElementById('album-art');

      titleEl.style.opacity = '0';
      titleEl.style.transform = 'translateY(-6px)';
      artistEl.style.opacity = '0';

      setTimeout(() => {
        titleEl.textContent = track.title;
        artistEl.textContent = track.artist;
        artEl.src = track.thumb || 'https://via.placeholder.com/300/8B5CF6/FFFFFF?text=🎵';
        titleEl.style.opacity = '1';
        titleEl.style.transform = 'translateY(0)';
        artistEl.style.opacity = '1';
      }, 100);

      if (player && player.loadVideoById) player.loadVideoById(track.id);
      updatePlayButton();
      renderQueue();
      if (sync && currentRoom && isHost) { syncState(); syncQueue(); }
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        if (player.getPlayerState() === YT.PlayerState.ENDED) {
          loadTrack(currentTrackIndex);
        } else {
          player.playVideo();
        }
      }
    }

    function updatePlayButton() {
      document.querySelector('#play-btn i').className = isPlaying ? 'fas fa-pause' : 'fas fa-play';
      document.getElementById('album-art').classList.toggle('playing', isPlaying);
      document.getElementById('album-container').classList.toggle('playing', isPlaying);
    }

    function prevTrack() {
      let i = currentTrackIndex - 1;
      if (i < 0) i = queue.length - 1;
      loadTrack(i);
    }

    function nextTrack() {
      let i = currentTrackIndex + 1;
      if (i >= queue.length) i = 0;
      loadTrack(i);
    }

    function seek(e) {
      if (!player || !player.getDuration) return;
      const bar = document.getElementById('progress-bar');
      const rect = bar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      player.seekTo(player.getDuration() * pct, true);
      if (currentRoom && isHost) syncState();
    }

    // ===== PROGRESS - RAF, BATCHED DOM WRITES =====
    function startProgress() {
      stopProgress();
      const fill = document.getElementById('progress');
      const timeEl = document.getElementById('current-time');
      const durEl = document.getElementById('duration');
      let lastTimeStr = '';
      let lastDurStr = '';

      function tick() {
        if (!player || !player.getCurrentTime || !player.getDuration) {
          progressRAF = requestAnimationFrame(tick);
          return;
        }
        const cur = player.getCurrentTime();
        const dur = player.getDuration();
        if (dur > 0) {
          const pct = cur / dur;
          if (Math.abs(pct - lastProgressPct) > 0.001) {
            fill.style.transform = 'scaleX(' + pct + ')';
            lastProgressPct = pct;
          }
          const ts = formatTime(cur);
          if (ts !== lastTimeStr) {
            timeEl.textContent = ts;
            lastTimeStr = ts;
          }
          const ds = formatTime(dur);
          if (ds !== lastDurStr) {
            durEl.textContent = ds;
            lastDurStr = ds;
          }
        }
        progressRAF = requestAnimationFrame(tick);
      }
      progressRAF = requestAnimationFrame(tick);
    }

    function stopProgress() {
      if (progressRAF) { cancelAnimationFrame(progressRAF); progressRAF = null; }
    }

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      return Math.floor(s / 60) + ':' + Math.floor(s % 60).toString().padStart(2, '0');
    }

    // ===== VOLUME / SPEED =====
    function setVolume(v) {
      volume = v / 100;
      document.getElementById('volume-text').textContent = v + '%';
      if (player && player.setVolume) player.setVolume(v);
    }

    function toggleSpeed() {
      const s = [0.5, 0.75, 1, 1.25, 1.5, 2];
      playbackSpeed = s[(s.indexOf(playbackSpeed) + 1) % s.length];
      document.getElementById('speed-btn').textContent = playbackSpeed + 'x';
      if (player && player.setPlaybackRate) player.setPlaybackRate(playbackSpeed);
    }

    // ===== QUEUE =====
    function renderQueue() {
      const list = document.getElementById('queue-list');
      if (!queue.length) {
        list.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:24px;font-size:0.88rem;">Queue is empty</p>';
        return;
      }
      let html = '';
      for (let i = 0; i < queue.length; i++) {
        const t = queue[i];
        html += '<div class="queue-item' + (i === currentTrackIndex ? ' active' : '') + '" onclick="loadTrack(' + i + ')">' +
          '<img src="' + (t.thumb || 'https://via.placeholder.com/46') + '" alt="" loading="lazy">' +
          '<div class="queue-item-info">' +
            '<div class="queue-item-title">' + t.title + '</div>' +
            '<div class="queue-item-artist">' + t.artist + '</div>' +
          '</div>' +
          '<div class="queue-item-actions">' +
            '<button onclick="event.stopPropagation();removeTrack(' + i + ')" aria-label="Remove"><i class="fas fa-times"></i></button>' +
          '</div></div>';
      }
      list.innerHTML = html;
    }

    function removeTrack(i) {
      if (queue.length <= 1) { alert('Cannot remove the last track!'); return; }
      queue.splice(i, 1);
      if (i < currentTrackIndex) currentTrackIndex--;
      if (i === currentTrackIndex) {
        currentTrackIndex = Math.min(currentTrackIndex, queue.length - 1);
        loadTrack(currentTrackIndex);
      }
      renderQueue();
      if (currentRoom && isHost) { syncState(); syncQueue(); }
    }

    function clearQueue() {
      if (confirm('Clear all tracks?')) {
        queue = [...demoTracks];
        currentTrackIndex = 0;
        loadTrack(0);
        renderQueue();
        if (currentRoom && isHost) { syncState(); syncQueue(); }
      }
    }

    // ===== SEARCH =====
    async function searchYouTube() {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      if (!YOUTUBE_API_KEY) {
        const rt = demoTracks[Math.floor(Math.random() * demoTracks.length)];
        queue.push({ ...rt, id: Math.random().toString(36).substr(2, 9) });
        renderQueue();
        alert('YouTube API key not set. Added demo track.');
        return;
      }
      try {
        const res = await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=' + encodeURIComponent(q) + '&type=video&key=' + YOUTUBE_API_KEY);
        const data = await res.json();
        if (data.error) { alert('Error: ' + data.error.message); return; }
        const results = data.items.map(item => ({
          id: item.id.videoId,
          title: item.snippet.title,
          artist: item.snippet.channelTitle,
          thumb: item.snippet.thumbnails.default.url
        }));
        displaySearchResults(results);
      } catch (err) { alert('Search failed: ' + err.message); }
    }

    function displaySearchResults(results) {
      const c = document.getElementById('search-results');
      if (!results.length) {
        c.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:24px;font-size:0.88rem;">No results</p>';
        return;
      }
      let html = '';
      for (let i = 0; i < results.length; i++) {
        const t = results[i];
        html += '<div class="queue-item" onclick="addToQueue(' + i + ')">' +
          '<img src="' + t.thumb + '" alt="" loading="lazy">' +
          '<div class="queue-item-info">' +
            '<div class="queue-item-title">' + t.title + '</div>' +
            '<div class="queue-item-artist">' + t.artist + '</div>' +
          '</div>' +
          '<div class="queue-item-actions"><button onclick="event.stopPropagation();addToQueue(' + i + ')"><i class="fas fa-plus"></i></button></div></div>';
      }
      c.innerHTML = html;
      window.searchResults = results;
    }

    function addToQueue(i) {
      if (window.searchResults && window.searchResults[i]) {
        queue.push(window.searchResults[i]);
        renderQueue();
        if (currentRoom && isHost) syncQueue();
      }
    }
